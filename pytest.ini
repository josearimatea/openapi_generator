[pytest]
# Stream logs to console in real time during test runs
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Custom markers — run integration tests explicitly with: pytest -m integration
markers =
    integration: end-to-end tests that make LLM calls (slow, costs tokens)
    rag: tests that require a running Qdrant instance with the configured collection
