[project]
name = "openapi-generator"
version = "0.1.0"
description = "LangGraph-based OpenAPI generation pipeline driven by a structured rules bank."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "langgraph>=0.6.10",
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
